<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nova AI</title>
  <link rel="icon" type="image/png" href="nova ai icon.png">
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-sidebar: #121212;
      --bg-card: #1a1a1a;
      --bg-chat-user: #222222;
      --bg-chat-ai: #161616;
      --accent: #ffee00;
      --accent-hover: #e6d500;
      --text-main: #f5f5f5;
      --text-muted: #888888;
      --border-color: #2a2a2a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Sidebar */
    #sidebar {
      width: 260px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      padding: 1rem;
      gap: 1rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent);
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-color);
    }

    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 6px;
    }

    .btn-primary {
      background-color: var(--accent);
      color: #000;
      border: none;
      padding: 0.75rem;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: background 0.2s;
    }

    .btn-primary:hover {
      background-color: var(--accent-hover);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .history-item {
      padding: 0.6rem 0.8rem;
      background: var(--bg-card);
      border-radius: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      border: 1px solid transparent;
    }

    .history-item:hover, .history-item.active {
      border-color: var(--accent);
      color: var(--text-main);
    }

    .settings-panel {
      font-size: 0.85rem;
      background: var(--bg-card);
      padding: 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .settings-panel select {
      width: 100%;
      padding: 0.4rem;
      margin-top: 0.4rem;
      background: #000;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }

    /* Main Area */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-sidebar);
    }

    .badge {
      background-color: #222;
      color: var(--accent);
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      border: 1px solid var(--accent);
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .message {
      max-width: 80%;
      padding: 1rem;
      border-radius: 8px;
      line-height: 1.5;
      font-size: 0.95rem;
    }

    .message.user {
      align-self: flex-end;
      background-color: var(--bg-chat-user);
      border-left: 3px solid var(--accent);
    }

    .message.assistant {
      align-self: flex-start;
      background-color: var(--bg-chat-ai);
      border: 1px solid var(--border-color);
    }

    .message pre {
      background: #000;
      padding: 0.75rem;
      border-radius: 6px;
      overflow-x: auto;
      margin-top: 0.5rem;
      border: 1px solid var(--border-color);
      color: var(--accent);
      font-family: 'Courier New', Courier, monospace;
    }

    .file-preview {
      font-size: 0.8rem;
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    /* Input Area */
    .input-container {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border-color);
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .file-tag {
      font-size: 0.8rem;
      background: var(--bg-card);
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 4px;
      align-self: flex-start;
      display: none;
    }

    .input-box {
      display: flex;
      gap: 0.75rem;
    }

    textarea {
      flex: 1;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.75rem;
      border-radius: 8px;
      resize: none;
      height: 48px;
      outline: none;
    }

    textarea:focus {
      border-color: var(--accent);
    }

    .file-btn {
      background-color: var(--bg-card);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #file-input {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="brand">
      <img src="nova ai icon.png" alt="Nova AI Logo">
      <span>Nova AI</span>
    </div>

    <button class="btn-primary" onclick="newChat()">+ Nueva Conversación</button>

    <div class="history-list" id="history-list">
      <!-- Historial dinámico -->
    </div>

    <div class="settings-panel">
      ⚙️ <strong>Configuración local</strong>
      <select id="model-select">
        <option value="Llama-3.2-1B-Instruct-q4f16_1-MLC">Llama 3.2 1B (Rápido)</option>
        <option value="Qwen2.5-Coder-1.5B-Instruct-q4f16_1-MLC">Qwen 2.5 Coder (Programación)</option>
      </select>
    </div>
  </div>

  <!-- Main View -->
  <div id="main">
    <div class="header">
      <div style="display: flex; align-items: center; gap: 0.5rem;">
        <span>🧠 Procesamiento 100% Local</span>
      </div>
      <span class="badge">🔒 Sin APIs / Offline</span>
    </div>

    <div id="chat-container">
      <div class="message assistant">
        👋 ¡Hola! Soy <strong>Nova AI</strong>. Todo lo que escribas se procesa de forma local en tu equipo sin enviar datos a servidores externos. ¿En qué te ayudo hoy?
      </div>
    </div>

    <div class="input-container">
      <div id="file-tag" class="file-tag"></div>
      <div class="input-box">
        <label for="file-input" class="file-btn" title="Adjuntar archivo de texto/código">📎</label>
        <input type="file" id="file-input" onchange="handleFile(this)">
        <textarea id="user-input" placeholder="Escribe tu mensaje o consulta de código..." onkeydown="handleKeyPress(event)"></textarea>
        <button class="btn-primary" onclick="sendMessage()">Enviar</button>
      </div>
    </div>
  </div>

  <!-- WebLLM Engine (Modelo IA en Navegador sin Backend) -->
  <script type="module">
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    let engine = null;
    let activeFileContent = "";
    let chats = JSON.parse(localStorage.getItem("nova_chats") || "[]");
    let currentChatId = Date.now();

    window.onload = () => {
      renderHistory();
      initEngine();
    };

    async function initEngine() {
      const selectedModel = document.getElementById("model-select").value;
      const chatContainer = document.getElementById("chat-container");
      
      try {
        engine = await webllm.CreateMLCEngine(selectedModel, {
          initProgressCallback: (report) => {
            console.log(report.text);
          }
        });
      } catch (e) {
        console.warn("Motor LLM local alternativo cargado.");
      }
    }

    window.handleKeyPress = (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    };

    window.handleFile = (input) => {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (e) => {
        activeFileContent = e.target.result;
        const tag = document.getElementById("file-tag");
        tag.innerText = `📄 ${file.name}`;
        tag.style.display = "block";
      };
      reader.readAsText(file);
    };

    window.sendMessage = async () => {
      const inputEl = document.getElementById("user-input");
      const text = inputEl.value.trim();
      if (!text && !activeFileContent) return;

      let fullPrompt = text;
      if (activeFileContent) {
        fullPrompt = `[Archivo adjunto]\n${activeFileContent}\n\n[Consulta]: ${text}`;
      }

      appendMessage("user", text + (activeFileContent ? " 📎 (Archivo incluido)" : ""));
      inputEl.value = "";
      clearFile();

      const aiMsgDiv = appendMessage("assistant", "Pensando...");

      try {
        if (engine) {
          const completion = await engine.chat.completions.create({
            messages: [{ role: "user", content: fullPrompt }],
            stream: true,
          });

          let fullResponse = "";
          for await (const chunk of completion) {
            const delta = chunk.choices[0]?.delta?.content || "";
            fullResponse += delta;
            aiMsgDiv.innerHTML = formatCode(fullResponse);
            document.getElementById("chat-container").scrollTop = document.getElementById("chat-container").scrollHeight;
          }
          saveToHistory(text, fullResponse);
        } else {
          // Respuesta de respaldo simulación si WebGPU no está disponible
          setTimeout(() => {
            const resp = "Respuesta simulada local (Activa WebGPU en tu navegador para ejecución directa del modelo LLM).";
            aiMsgDiv.innerHTML = resp;
            saveToHistory(text, resp);
          }, 800);
        }
      } catch (err) {
        aiMsgDiv.innerText = "Error ejecutando el modelo local.";
      }
    };

    function appendMessage(role, content) {
      const container = document.getElementById("chat-container");
      const div = document.createElement("div");
      div.className = `message ${role}`;
      div.innerHTML = formatCode(content);
      container.appendChild(div);
      container.scrollTop = container.scrollHeight;
      return div;
    }

    function formatCode(text) {
      return text.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
    }

    function clearFile() {
      activeFileContent = "";
      document.getElementById("file-input").value = "";
      document.getElementById("file-tag").style.display = "none";
    }

    function saveToHistory(userText, aiText) {
      chats.unshift({ title: userText.substring(0, 30) + "...", date: new Date().toLocaleTimeString() });
      localStorage.setItem("nova_chats", JSON.stringify(chats));
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById("history-list");
      list.innerHTML = "";
      chats.forEach(chat => {
        const item = document.createElement("div");
        item.className = "history-item";
        item.innerText = chat.title;
        list.appendChild(item);
      });
    }

    window.newChat = () => {
      document.getElementById("chat-container").innerHTML = `
        <div class="message assistant">
          👋 Nueva conversación iniciada. ¿En qué te ayudo?
        </div>
      `;
    };
  </script>
</body>
</html>
